services:
  netbox-app:
    build:
      context: .
      dockerfile: Containerfile
    container_name: netbox-app
    env_file:
      - path: .env
        required: true
    expose:
      - "8080"
    volumes:
      - netbox-static:/opt/netbox/netbox/static
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
      netbox-migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./scripts
          target: /opt/netbox/custom-scripts
        - action: sync
          path: ./scripts
          target: /opt/netbox/netbox/scripts

  netbox-rqworker:
    build:
      context: .
      dockerfile: Containerfile
    container_name: netbox-rqworker
    entrypoint: "python3 /opt/netbox/netbox/manage.py rqworker high default low"
    env_file:
      - path: .env
        required: true
    depends_on:
      netbox-app:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
      netbox-migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./scripts
          target: /opt/netbox/custom-scripts
        - action: sync
          path: ./scripts
          target: /opt/netbox/netbox/scripts
      
  netbox-migrate:
    build:
      context: .
      dockerfile: Containerfile
    env_file:
      - path: .env
        required: true
    working_dir: /opt/netbox
    entrypoint: ["bash", "-ex", "migrate.sh"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  netbox-static:
    image: nginx:stable
    container_name: netbox-static
    ports:
      - "8080:8080"
    volumes:
      - ./nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
      - netbox-static:/opt/netbox/netbox/static:ro
    depends_on:
      - netbox-app

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: veryrealpassworod
      POSTGRES_DB: netbox
    # post_start:
    #   - command: "bash -ex sync-local-db.sh"
    #     working_dir: /
    env_file:
      - path: .env-remote-netbox
        required: false
    volumes:
      - ./sync-local-db.sh:/sync-local-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox -d netbox"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: docker.io/chrislusf/seaweedfs
    container_name: s3
    ports:
      - "8333:8333"
    environment:
      - AWS_ACCESS_KEY_ID=netbox
      - AWS_SECRET_ACCESS_KEY=netbox
      - S3_BUCKET=netbox

volumes:
  netbox-static:
